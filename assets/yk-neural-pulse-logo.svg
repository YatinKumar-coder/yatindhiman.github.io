<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Yatin Kumar Neural Pulse logo</title>
  <desc id="desc">A neural network inspired YK monogram with neurons and a flowing data pulse.</desc>
  <defs>
    <linearGradient id="pulse" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#6f67ff"/><stop offset=".48" stop-color="#11d5d0"/><stop offset="1" stop-color="#d9f75a"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(20 20)">
    <rect width="320" height="320" rx="58" fill="#111b31"/>
    <circle cx="160" cy="160" r="119" fill="none" stroke="#59647d" stroke-width="2" opacity=".5"/>
    <circle cx="160" cy="160" r="95" fill="none" stroke="#59647d" stroke-width="2" stroke-dasharray="4 12" opacity=".6"/>
    <!-- neural connections -->
    <g stroke="#73819d" stroke-width="3" opacity=".72"><path d="M38 166 91 102 133 149"/><path d="M38 166 91 228 134 173"/><path d="M188 149 242 90 286 130"/><path d="M188 173 242 232 286 195"/></g>
    <!-- neural data pulse -->
    <path d="M34 166C76 166 76 104 112 104c35 0 31 71 62 71 32 0 33-83 77-83 21 0 29 23 38 38" fill="none" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M34 166C76 166 76 104 112 104c35 0 31 71 62 71 32 0 33-83 77-83 21 0 29 23 38 38" fill="none" stroke="#f4f6fb" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <!-- neuron nodes -->
    <g fill="#d9f75a"><circle cx="34" cy="166" r="11"/><circle cx="112" cy="104" r="11"/><circle cx="251" cy="92" r="11"/><circle cx="289" cy="130" r="11"/></g>
    <g fill="#19d6d0"><circle cx="91" cy="228" r="8"/><circle cx="242" cy="232" r="8"/><circle cx="286" cy="195" r="8"/></g>
    <circle cx="160" cy="160" r="62" fill="#111b31" stroke="url(#pulse)" stroke-width="4"/>
    <text x="160" y="179" text-anchor="middle" fill="#f6f3ec" font-family="Georgia, serif" font-size="58" font-weight="700">YK</text>
  </g>
  <g transform="translate(390 110)">
    <text x="0" y="0" fill="#17241f" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="5">YATIN KUMAR</text>
    <path d="M2 42H637" stroke="url(#pulse)" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="90" fill="#506056" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">NEURAL PULSE / DEEP LEARNING</text>
    <text x="0" y="128" fill="#738078" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">SCIENTIFIC MACHINE LEARNING · COMPUTATIONAL MATHEMATICS</text>
  </g>
</svg>
